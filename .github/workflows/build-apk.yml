name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMAN="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMAN" ]; then
            echo "找不到 sdkmanager，列出目录："
            ls -la "$SDK" || true
            exit 1
          fi
          echo "sdkmanager=$SDKMAN"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "--- 已安装 ---"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 构建 debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: XbwExp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
