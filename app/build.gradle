plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xbw.exp'
    compileSdk 34

    defaultConfig {
        applicationId "com.xbw.exp"
        minSdk 26
        targetSdk 34
        // CI 传 -Pvc=<run_number>，本地构建默认 1，方便在手机上确认装的是哪一版
        versionCode project.hasProperty('vc') ? project.property('vc').toInteger() : 1
        versionName project.hasProperty('vc') ? "1.0." + project.property('vc') : "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
